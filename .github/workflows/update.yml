name: Update ^NDX daily data

# Runs on a schedule AND on-demand. Do NOT split follow-up work into a second
# workflow triggered by this push: pushes made with GITHUB_TOKEN do not trigger
# further workflow runs.
on:
  schedule:
    # 07:15 UTC every day (~a few hours after US market close). Cron is UTC.
    - cron: "15 7 * * *"
  workflow_dispatch: {}

# GITHUB_TOKEN needs write access to push the updated data files back.
permissions:
  contents: write

concurrency:
  group: ndx-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch ^NDX data
        run: python src/fetch_ndx.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/latest.json data/meta.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update ^NDX daily data"
            git push
          fi
